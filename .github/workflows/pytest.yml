name: quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 uv 和 Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 安装后端依赖
        run: uv sync --locked --dev

      - name: 运行 pytest
        run: uv run pytest

      - name: 运行 Ruff
        run: uv run ruff check backend evaluations

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 运行前端测试
        run: npm test

      - name: 运行 ESLint
        run: npm run lint

      - name: 构建前端
        run: npm run build

  container:
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 构建前后端镜像
        run: docker compose build

      - name: 启动并等待容器健康
        run: docker compose up --detach --wait --wait-timeout 120

      - name: 验证反向代理健康接口
        run: curl --fail --silent --show-error http://127.0.0.1:5173/api/health

      - name: 输出失败诊断信息
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: 清理容器与测试数据卷
        if: always()
        run: docker compose down --volumes --remove-orphans
