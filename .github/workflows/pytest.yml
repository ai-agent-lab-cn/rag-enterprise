name: quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rag_test
      TEST_RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rag_restore
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 uv 和 Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 安装后端依赖
        run: uv sync --locked --dev

      - name: 安装 PostgreSQL 客户端
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: 运行 pytest
        run: uv run pytest

      - name: 运行 Ruff
        run: uv run ruff check backend evaluations scripts

      - name: 执行隔离备份恢复演练
        run: |
          mkdir -p /tmp/rongrag-source/{chroma,uploads,knowledge_bases,conversations,auth,audit}
          printf 'index-fixture\n' > /tmp/rongrag-source/chroma/chroma.sqlite3
          printf 'upload-fixture\n' > /tmp/rongrag-source/uploads/document.md
          printf '{"version":1,"knowledge_bases":[]}\n' > /tmp/rongrag-source/knowledge_bases/registry.json
          printf '{"version":1,"conversations":[],"answers":[]}\n' > /tmp/rongrag-source/conversations/records.json
          printf '{"version":1,"users":[],"sessions":[],"memberships":[]}\n' > /tmp/rongrag-source/auth/store.json
          printf '{"version":1,"events":[]}\n' > /tmp/rongrag-source/audit/events.json
          uv run python scripts/backup_restore.py backup --data-root /tmp/rongrag-source --output /tmp/rongrag.tar.gz
          uv run python scripts/backup_restore.py verify --backup /tmp/rongrag.tar.gz
          uv run python scripts/backup_restore.py restore --backup /tmp/rongrag.tar.gz --target /tmp/rongrag-restored
          diff -r /tmp/rongrag-source /tmp/rongrag-restored

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 运行前端测试
        run: npm test

      - name: 运行 ESLint
        run: npm run lint

      - name: 构建前端
        run: npm run build

  container:
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 构建前后端镜像
        run: docker compose build

      - name: 启动并等待容器健康
        env:
          EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
          RERANKER_MODEL: demo/lexical-overlap-v1
          DEMO_SEED_PATH: /app/knowledge/project-profile.md
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          TOKENIZERS_PARALLELISM: "false"
          MALLOC_ARENA_MAX: "2"
        run: docker compose up --detach --wait --wait-timeout 600

      - name: 验证健康、演示资料与基础问答
        env:
          SMOKE_ADMIN_USERNAME: ci-smoke-admin
          SMOKE_ADMIN_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-temporary
        run: python scripts/smoke_demo.py http://127.0.0.1:5173 --allow-retrieval-only

      - name: 输出失败诊断信息
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: 清理容器与测试数据卷
        if: always()
        run: docker compose down --volumes --remove-orphans

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 校验发布编排与回滚脚本
        env:
          RELEASE_BACKEND_IMAGE: example.invalid/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RELEASE_FRONTEND_IMAGE: example.invalid/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          ACTIVE_DATA_ROOT: /tmp/rongrag-release-contract
        run: |
          docker compose --file docker-compose.release.yml config --quiet
          bash -n scripts/verify_release_rollback.sh
