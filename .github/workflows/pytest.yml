name: quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rag_test
      TEST_RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rag_restore
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: probe
      MINIO_SECRET_KEY: probe12345
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 uv 和 Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 安装后端依赖
        run: uv sync --locked --dev

      - name: 安装 PostgreSQL 客户端
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      # MinIO 不能像 postgres 那样写成 service：service 容器无法传命令参数，而
      # minio 镜像的默认 CMD 只打印帮助（实测），必须显式给 `server /data`。
      # 健康检查用镜像自带的 curl 打 /minio/health/live（实测返回 200）；镜像里
      # 没有 mc，别改成 `mc ready`。
      - name: 启动 MinIO
        run: |
          docker run --detach --name minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            --health-cmd 'curl -fsS http://127.0.0.1:9000/minio/health/live' \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' minio)" = healthy ]; then
              echo "MinIO 已就绪"
              exit 0
            fi
            sleep 2
          done
          docker logs minio
          exit 1

      - name: 运行 pytest
        run: uv run pytest

      - name: 运行 Ruff
        run: uv run ruff check backend evaluations scripts

      - name: 校验 Kubernetes 清单与演练脚本
        run: |
          uv run python -m scripts.validate_kubernetes
          bash -n scripts/kubernetes_rehearsal.sh
          bash -n scripts/kubernetes_observe.sh
          bash -n scripts/kubernetes_controlled_pilot.sh

      - name: 执行隔离备份恢复演练
        run: |
          mkdir -p /tmp/rongrag-source/{uploads,knowledge_bases,conversations,auth,audit}
          printf 'upload-fixture\n' > /tmp/rongrag-source/uploads/document.md
          printf '{"version":1,"knowledge_bases":[]}\n' > /tmp/rongrag-source/knowledge_bases/registry.json
          printf '{"version":1,"conversations":[],"answers":[]}\n' > /tmp/rongrag-source/conversations/records.json
          printf '{"version":1,"users":[],"sessions":[],"memberships":[]}\n' > /tmp/rongrag-source/auth/store.json
          printf '{"version":1,"events":[]}\n' > /tmp/rongrag-source/audit/events.json
          uv run python scripts/backup_restore.py backup --data-root /tmp/rongrag-source --output /tmp/rongrag.tar.gz
          uv run python scripts/backup_restore.py verify --backup /tmp/rongrag.tar.gz
          uv run python scripts/backup_restore.py restore --backup /tmp/rongrag.tar.gz --target /tmp/rongrag-restored
          diff -r /tmp/rongrag-source /tmp/rongrag-restored

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 运行前端测试
        run: npm test

      - name: 运行 ESLint
        run: npm run lint

      - name: 构建前端
        run: npm run build

  container:
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 构建前后端镜像
        env:
          POSTGRES_PASSWORD: ci-container-smoke
        run: docker compose build

      # Chroma 移除后向量存储只有 pgvector，compose 自身即完整拓扑（postgres、
      # migrate、backend、worker、frontend）。应用启动只校验 schema 版本、不自动迁移，
      # 因此必须先显式跑 migrate，否则 backend 的健康检查永远不会通过。
      - name: 应用数据库迁移
        env:
          POSTGRES_PASSWORD: ci-container-smoke
        run: docker compose --profile tools run --rm migrate

      - name: 启动并等待容器健康
        env:
          POSTGRES_PASSWORD: ci-container-smoke
          EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
          RERANKER_MODEL: demo/lexical-overlap-v1
          DEMO_SEED_PATH: /app/knowledge/project-profile.md
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          TOKENIZERS_PARALLELISM: "false"
          MALLOC_ARENA_MAX: "2"
        run: docker compose up --detach --wait --wait-timeout 600 postgres backend worker frontend

      - name: 验证健康、演示资料与基础问答
        env:
          SMOKE_ADMIN_USERNAME: ci-smoke-admin
          SMOKE_ADMIN_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-temporary
        run: python scripts/smoke_demo.py http://127.0.0.1:5173 --allow-retrieval-only

      - name: 安装 Chromium 并执行浏览器验收
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          SMOKE_ADMIN_USERNAME: ci-smoke-admin
          SMOKE_ADMIN_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-temporary
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: 上传浏览器失败证据
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: 输出失败诊断信息
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-container-smoke
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: 清理容器与测试数据卷
        if: always()
        env:
          POSTGRES_PASSWORD: ci-container-smoke
        run: docker compose down --volumes --remove-orphans

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 校验发布编排与回滚脚本
        env:
          RELEASE_BACKEND_IMAGE: example.invalid/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RELEASE_FRONTEND_IMAGE: example.invalid/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          RELEASE_POSTGRES_IMAGE: docker.io/pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
          POSTGRES_PASSWORD: release-contract-placeholder
          ACTIVE_POSTGRES_ROOT: /tmp/rongrag-release-contract/postgres
          ACTIVE_UPLOADS_ROOT: /tmp/rongrag-release-contract/uploads
          ACTIVE_BACKUPS_ROOT: /tmp/rongrag-release-contract/backups
        run: |
          docker compose --file docker-compose.release.yml config --quiet
          bash -n scripts/verify_release_rollback.sh
