apiVersion: batch/v1
kind: Job
metadata:
  name: rag-postgres-backup-BACKUP_ID
  namespace: rag-enterprise
  labels:
    app.kubernetes.io/part-of: rag-enterprise
    app.kubernetes.io/component: backup
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: rag-enterprise
        app.kubernetes.io/component: backup
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backup
          image: rag-enterprise-backend:issue-84
          imagePullPolicy: Never
          args:
            - python
            - -m
            - scripts.postgres_backup
            - backup
            - --uploads-root
            - /app/data/uploads
            - --output
            - /backups/rag-postgres-BACKUP_ID.tar.gz
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: rag-enterprise-secrets, key: DATABASE_URL}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: uploads, mountPath: /app/data/uploads, readOnly: true}
            - {name: backups, mountPath: /backups}
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: rag-uploads}
        - name: backups
          persistentVolumeClaim: {claimName: rag-backups}
