apiVersion: v1
kind: Secret
metadata:
  name: rag-enterprise-secrets
  namespace: rag-enterprise
  labels:
    app.kubernetes.io/part-of: rag-enterprise
type: kubernetes.io/basic-auth
stringData:
  username: rag
  password: replace-with-a-random-local-password
  DATABASE_URL: postgresql://rag:replace-with-a-random-local-password@rag-postgres-rw:5432/rag_enterprise
  # 正式检索评测专用库。库名必须是 rag_enterprise_evaluation：Evaluation Worker 只允许
  # 自动创建这一个库，且启动时会拒绝与 DATABASE_URL 相同的连接串。
  EVALUATION_DATABASE_URL: postgresql://rag:replace-with-a-random-local-password@rag-postgres-rw:5432/rag_enterprise_evaluation
  GEMINI_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  KIMI_API_KEY: ""
  SEARXNG_SECRET: replace-with-a-random-searxng-secret
