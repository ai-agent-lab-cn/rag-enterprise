apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rag-postgres-ingress
  namespace: rag-enterprise
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: rag-postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [backend, worker, migrate, backup, restore]
      ports:
        - {protocol: TCP, port: 5432}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cnpg-system}
      ports:
        - {protocol: TCP, port: 8000}
