apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-uploads
  namespace: rag-enterprise
  labels:
    app.kubernetes.io/part-of: rag-enterprise
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-backups
  namespace: rag-enterprise
  labels:
    app.kubernetes.io/part-of: rag-enterprise
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
