apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rag-postgres
  namespace: rag-enterprise
  labels:
    app.kubernetes.io/part-of: rag-enterprise
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15-202608170814-standard-trixie@sha256:3df9103d7f89c8abc2870463d4d446944c81b5f1f4b707c590895dc003ecbb65
  primaryUpdateStrategy: unsupervised
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  bootstrap:
    initdb:
      database: rag_enterprise
      owner: rag
      secret:
        name: rag-enterprise-secrets
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  monitoring:
    enablePodMonitor: false
