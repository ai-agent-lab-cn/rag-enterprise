[project]
name = "rongrag-studio"
version = "1.0.0"
description = "An explainable personal-document RAG system with retrieval evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "minio>=7.2.0",
    "openai>=1.0.0",
    "fastapi>=0.116.0",
    "google-genai>=1.24.0",
    "pydantic-settings>=2.10.0",
    "pgvector>=0.4.1",
    "psycopg[binary]>=3.2.9",
    "pypdf>=5.7.0",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "sentence-transformers>=5.0.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "pyyaml>=6.0.2",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "evaluations"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 提示词正文是模型的输入，不是代码。给它折行会改变发给模型的文本、改变 prompt_hash，
# 而 `# noqa` 写在三引号字符串里只会变成提示词的一部分——两条路都不能走。
"backend/app/prompts.py" = ["E501"]
