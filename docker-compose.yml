services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    expose:
      - "8000"
    volumes:
      - chroma_data:/app/data/chroma
      - uploads_data:/app/data/uploads
      - knowledge_bases_data:/app/data/knowledge_bases
      - conversations_data:/app/data/conversations
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/api/health
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6

volumes:
  chroma_data:
  uploads_data:
  knowledge_bases_data:
  conversations_data:
