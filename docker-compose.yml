services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-shibing624/text2vec-base-chinese}"
      RERANKER_MODEL: "${RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}"
      DEMO_SEED_PATH: "${DEMO_SEED_PATH:-}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-}"
      OPENBLAS_NUM_THREADS: "${OPENBLAS_NUM_THREADS:-}"
      TOKENIZERS_PARALLELISM: "${TOKENIZERS_PARALLELISM:-}"
      MALLOC_ARENA_MAX: "${MALLOC_ARENA_MAX:-}"
    expose:
      - "8000"
    volumes:
      - chroma_data:/app/data/chroma
      - uploads_data:/app/data/uploads
      - knowledge_bases_data:/app/data/knowledge_bases
      - conversations_data:/app/data/conversations
      - auth_data:/app/data/auth
      - audit_data:/app/data/audit
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/api/health/ready
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6

volumes:
  chroma_data:
  uploads_data:
  knowledge_bases_data:
  conversations_data:
  auth_data:
  audit_data:
