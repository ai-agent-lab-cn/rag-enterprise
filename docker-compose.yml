services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-rag_enterprise}"
      POSTGRES_USER: "${POSTGRES_USER:-rag}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag_enterprise}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "scripts.database_migrate", "apply"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rag_enterprise}"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rag_enterprise}"
      REQUIRED_DATABASE_SCHEMA_VERSION: "25"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.6-flash}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_BALANCE_LIMIT: "${DEEPSEEK_BALANCE_LIMIT:-}"
      KIMI_API_KEY: "${KIMI_API_KEY:-}"
      KIMI_MODEL: "${KIMI_MODEL:-kimi-k2.6}"
      KIMI_BASE_URL: "${KIMI_BASE_URL:-https://api.moonshot.cn/v1}"
      KIMI_BALANCE_LIMIT: "${KIMI_BALANCE_LIMIT:-}"
      GENERATION_PROVIDER: "${GENERATION_PROVIDER:-deepseek}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-shibing624/text2vec-base-chinese}"
      RERANKER_MODEL: "${RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}"
      DEMO_SEED_PATH: "${DEMO_SEED_PATH:-}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-1}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-1}"
      OPENBLAS_NUM_THREADS: "${OPENBLAS_NUM_THREADS:-1}"
      TOKENIZERS_PARALLELISM: "false"
      MALLOC_ARENA_MAX: "${MALLOC_ARENA_MAX:-}"
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/data/uploads
      - knowledge_bases_data:/app/data/knowledge_bases
      - conversations_data:/app/data/conversations
      - auth_data:/app/data/auth
      - audit_data:/app/data/audit
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  # 索引是异步的：没有 Worker 消费 index_jobs，上传的文档会一直停在 pending。
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "scripts.index_worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rag_enterprise}"
      REQUIRED_DATABASE_SCHEMA_VERSION: "25"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-shibing624/text2vec-base-chinese}"
      INDEX_WORKER_ID: "${INDEX_WORKER_ID:-worker-compose}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-1}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-1}"
      OPENBLAS_NUM_THREADS: "${OPENBLAS_NUM_THREADS:-1}"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/api/health/ready
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6

volumes:
  postgres_data:
  uploads_data:
  knowledge_bases_data:
  conversations_data:
  auth_data:
  audit_data:
